<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест Node.js API с Progress Bar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f4f9;
    }
    .container {
      max-width: 600px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    /* Стили для контейнера прогресс-бара */
    #progressContainer {
      display: none; /* Скрыт по умолчанию */
      margin-top: 20px;
      flex-direction: column;
      gap: 8px;
    }
    progress {
      width: 100%;
      height: 20px;
    }
    .status-text {
      font-size: 14px;
      color: #555;
      display: flex;
      justify-content: space-between;
    }
    pre {
      background: #272822;
      color: #f8f8f2;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Получение данных из API v4</h2>
  <button id="fetchBtn">Запросить данные (Ожидание 15 сек)</button>

  <!-- Контейнер с Progress Bar -->
  <div id="progressContainer">
    <progress id="progressBar" value="0" max="100"></progress>
    <div class="status-text">
      <span id="statusLabel">Загрузка данных...</span>
      <span id="percentageLabel">0%</span>
    </div>
  </div>

  <!-- Блок для вывода результата -->
  <pre id="result"></pre>
</div>

<script>
  const fetchBtn = document.getElementById('fetchBtn');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const statusLabel = document.getElementById('statusLabel');
  const percentageLabel = document.getElementById('percentageLabel');
  const resultBlock = document.getElementById('result');

  fetchBtn.addEventListener('click', async () => {
    // 1. Инициализация интерфейса
    progressContainer.style.display = 'flex';
    resultBlock.style.display = 'none';
    fetchBtn.disabled = true;
    
    progressBar.value = 0;
    percentageLabel.textContent = '0%';
    statusLabel.textContent = 'Соединение с сервером...';

    // 2. Настройка таймера для прогресс-бара
    const totalSeconds = 15; // Время ожидания ответа сервера
    let currentSecond = 0;

    const progressInterval = setInterval(() => {
      currentSecond++;
      // Вычисляем процент выполнения
      const percentage = Math.min(Math.round((currentSecond / totalSeconds) * 100), 100);
      
      progressBar.value = percentage;
      percentageLabel.textContent = `${percentage}%`;
      statusLabel.textContent = `Загрузка... Осталось примерно ${totalSeconds - currentSecond} сек.`;

      // На всякий случай останавливаем таймер, если он дошел до 100%, а ответ еще не пришел
      if (currentSecond >= totalSeconds) {
        clearInterval(progressInterval);
        statusLabel.textContent = 'Ожидание ответа от сервера...';
      }
    }, 1000); // Обновляем каждую секунду (1000 мс)

    // 3. Контроллер таймаута для самого запроса (с запасом в 50 сек)
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 50000);

    try {
      // 4. Отправка запроса
      const response = await fetch('http://localhost:3000', {
        method: 'GET',
        signal: controller.signal
      });

      if (!response.ok) {
        throw new Error(`Ошибка сервера: ${response.status}`);
      }

      const json = await response.json();

      // 5. Вывод успешного результата
      resultBlock.textContent = JSON.stringify(json, null, 2);
      resultBlock.style.display = 'block';

    } catch (error) {
      // Обработка ошибок
      resultBlock.textContent = error.name === 'AbortError' 
        ? 'Ошибка: Превышено время ожидания ответа от сервера.' 
        : `Произошла ошибка: ${error.message}`;
      resultBlock.style.display = 'block';
    } finally {
      // 6. Очистка таймеров и сброс состояния кнопки
      clearInterval(progressInterval);
      clearTimeout(timeoutId);
      progressContainer.style.display = 'none';
      fetchBtn.disabled = false;
    }
  });
</script>

</body>
</html>
